---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: instancer-manager
rules:
- apiGroups:
  - ""
  resources:
  - limitranges
  - namespaces
  - pods
  - resourcequotas
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - instancer.anvil.dev
  resources:
  - challengeinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - instancer.anvil.dev
  resources:
  - challengeinstances/finalizers
  verbs:
  - update
- apiGroups:
  - instancer.anvil.dev
  resources:
  - challengeinstances/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - traefik.io
  resources:
  - ingressroutes
  - ingressroutetcps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
