# One multi-SAN wildcard cert covering every instanced category, wired as
# Traefik's default TLS store. Instance IngressRoutes then set an empty tls
# block and Traefik serves this cert by SNI — no per-namespace secret copying.
# Add a category: append its wildcard to dnsNames and redeploy.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-instances
  namespace: traefik
spec:
  secretName: wildcard-instances-tls
  issuerRef:
    name: letsencrypt-cf
    kind: ClusterIssuer
  dnsNames:
    - "*.web.h7tex.com"
    - "*.pwn.h7tex.com"
    - "*.web3.h7tex.com"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-instances-tls
