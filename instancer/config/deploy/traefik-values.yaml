# Traefik values (reconciled into repo = live release, revision 4).
# Raw-TCP challenge instances (pwn/web3) do NOT go through Traefik: its TCP proxy
# drops the server's reply on a client half-close (shutdown(SHUT_WR)), so it can
# never deliver a flag. They are served by the anvil `tcpproxy` (a half-close-
# preserving L4 proxy behind its own passthrough NLB) — see config/deploy/tcpproxy.yaml.
# So the old 64-port pool (t30000-t30063) + the separate `tcppool` LoadBalancer
# that lived here have been REMOVED. This file now only carries the main LB
# (web/websecure from chart defaults) + the legacy pwn SNI :1337 entrypoint
# (used only by the controller's SNI fallback when the port pool is disabled).
# Apply (kubectl/helm pointed at the cluster):
#   helm upgrade traefik traefik/traefik --version 41.6.0 -n traefik -f traefik-values.yaml
deployment:
  replicas: 2
service:
  type: LoadBalancer
ports:
  pwn:
    port: 1337
    protocol: TCP
    expose:
      default: true
