# Traefik values (reconciled into repo). Main LB keeps web/api (:443) + pwn SNI (:1337).
# tcppool: a SEPARATE LoadBalancer exposing a contiguous plain-TCP port range for
# raw-TCP challenge instances (nc host port, half-close works). generous entrypoint
# timeouts so interactive challenge connections are not idle-dropped mid-solve.
# The t30000-t30063 range must stay in sync with INSTANCER_TCP_POOL_RANGE in operator.yaml.
# Apply (from a box with kubectl/helm pointed at the cluster):
#   helm upgrade traefik traefik/traefik --version 41.6.0 -n traefik -f traefik-values.yaml
deployment:
  replicas: 2
service:
  type: LoadBalancer
  additionalServices:
    tcppool:
      spec:
        type: LoadBalancer
ports:
  pwn:
    port: 1337
    protocol: TCP
    expose:
      default: true
  t30000:
    port: 30000
    exposedPort: 30000
    protocol: TCP
    expose:
      tcppool: true
    transport:
      respondingTimeouts:
        readTimeout: "0s"
        writeTimeout: "0s"
        idleTimeout: "600s"
  t30001:
    port: 30001
    exposedPort: 30001
    protocol: TCP
    expose:
      tcppool: true
    transport:
      respondingTimeouts:
        readTimeout: "0s"
