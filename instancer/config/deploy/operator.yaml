# Anvil instancer operator: namespace, service account, RBAC binding, deployment.
# The CRD (config/crd) and ClusterRole (config/rbac/role.yaml) are applied first.
apiVersion: v1
kind: Namespace
metadata:
  name: anvil-instancer
  labels:
    app.kubernetes.io/part-of: anvil
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: instancer
  namespace: anvil-instancer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: instancer-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: instancer-manager
subjects:
  - kind: ServiceAccount
    name: instancer
    namespace: anvil-instancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instancer
  namespace: anvil-instancer
  labels:
    app: instancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: instancer
  template:
    metadata:
      labels:
        app: instancer
    spec:
      serviceAccountName: instancer
      nodeSelector: { pool: platform }
      # k8s injects ~5 env vars per port of every service in the namespace; the
      # 10k-port tcpproxy lb would overflow exec's arg limit (E2BIG) at startup.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/anvil-instancer:latest
          args: []
          env:
            - name: INSTANCER_BASE_DOMAIN
              value: h7tex.com
            - name: INSTANCER_RUNTIME_CLASS
              value: gvisor
            - name: INSTANCER_TRAEFIK_NAMESPACE
              value: traefik
            - name: INSTANCER_RESYNC
              value: 30s
            # a launch wave reconciles in parallel; ready instances are a cache read.
            - name: INSTANCER_MAX_CONCURRENT
              value: "32"
            # pod requests as % of limits: idle challenges reserve a slice, not the
            # whole limit, so a node packs ~100 of them (limits still cap each pod).
            - name: INSTANCER_CPU_REQUEST_PCT
              value: "10"
            - name: INSTANCER_MEM_REQUEST_PCT
              value: "25"
            # no instance outlives this, extensions included (longest legit: 120m + 4x30m).
            - name: INSTANCER_MAX_LIFETIME
              value: 4h
            # legacy SNI+TLS fallback (used only if the pool below is unset)
            - name: INSTANCER_TCP_ROUTES
              value: "pwn=pwn:1337,web3=pwn:1337"
            # plain-TCP per-instance port pool: each raw-TCP instance gets a random
            # free port on the tcpproxy NLB so `nc host port` + half-close work.
            # Must equal PROXY_POOL_RANGE in tcpproxy.yaml (deploy script checks).
            - name: INSTANCER_TCP_POOL_RANGE
              value: "40000-49999"
            - name: INSTANCER_TCP_POOL_NAMESPACE
              value: anvil-instancer
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
