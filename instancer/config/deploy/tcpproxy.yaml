# Raw-TCP half-close-preserving proxy for pwn/web3 challenge instances.
# Bypasses Traefik (whose TCP proxy drops the reply on a client half-close, so it
# can never deliver a flag). A GKE L4 passthrough NLB (tcpproxy-service.sh) fronts
# these pods on every pool port; the proxy routes each port to its instance's
# ClusterIP service (read from the port-lock ConfigMaps), half-close intact.
# PROXY_POOL_RANGE below is the pool's single source: deploy-instancer.sh checks
# the operator's INSTANCER_TCP_POOL_RANGE matches and builds the LB from it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcpproxy
  namespace: anvil-instancer
spec:
  replicas: 2
  selector:
    matchLabels: { app: tcpproxy }
  template:
    metadata:
      labels: { app: tcpproxy }
    spec:
      serviceAccountName: instancer
      nodeSelector: { pool: platform }
      # k8s injects ~5 env vars per port of every service in the namespace; the
      # 10k-port tcpproxy lb would overflow exec's arg limit (E2BIG) at startup.
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: tcpproxy }
      containers:
        - name: tcpproxy
          image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/anvil-tcpproxy:latest
          env:
            - { name: PROXY_POOL_RANGE, value: "40000-49999" }
            - { name: PROXY_POOL_NAMESPACE, value: anvil-instancer }
            - { name: PROXY_REFRESH, value: "3s" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "2", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
