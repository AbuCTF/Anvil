# Raw-TCP half-close-preserving proxy for pwn/web3 challenge instances.
# Bypasses Traefik (whose TCP proxy drops the reply on a client half-close, so it
# can never deliver a flag). A GKE L4 passthrough NLB fronts these pods on the
# pool ports 30000-30063; the proxy routes each port to its instance's ClusterIP
# service (read from the port-lock ConfigMaps) preserving half-close end to end.
# Keep the port range in sync with INSTANCER_TCP_POOL_RANGE (operator.yaml) and
# PROXY_POOL_RANGE below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcpproxy
  namespace: anvil-instancer
spec:
  replicas: 2
  selector:
    matchLabels: { app: tcpproxy }
  template:
    metadata:
      labels: { app: tcpproxy }
    spec:
      serviceAccountName: instancer
      containers:
        - name: tcpproxy
          image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/anvil-tcpproxy:latest
          env:
            - { name: PROXY_POOL_RANGE, value: "30000-30063" }
            - { name: PROXY_POOL_NAMESPACE, value: anvil-instancer }
            - { name: PROXY_REFRESH, value: "3s" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: tcpproxy
  namespace: anvil-instancer
  annotations:
    # external passthrough L4 NLB (preserves TCP half-close)
    cloud.google.com/l4-rbs: "enabled"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector: { app: tcpproxy }
  ports:
    - name: t30000
      port: 30000
      targetPort: 30000
      protocol: TCP
    - name: t30001
      port: 30001
      targetPort: 30001
      protocol: TCP
