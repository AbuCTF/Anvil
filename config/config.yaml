# anvil platform configuration
# env vars override everything here — prefix with ANVIL_
# e.g. ANVIL_SERVER_PORT=9000, ANVIL_JWT_SECRET=...

environment: production

server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s
  trusted_proxies:
    - "172.16.0.0/12"
    - "127.0.0.1"

database:
  host: postgres
  port: 5432
  user: anvil
  password: ""          # set via ANVIL_DATABASE_PASSWORD in .env
  database: anvil
  ssl_mode: disable
  max_open_conns: 50
  max_idle_conns: 25

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

jwt:
  secret: ""            # set via ANVIL_JWT_SECRET in .env
  access_expiry: 15m
  refresh_expiry: 168h
  issuer: anvil

container:
  runtime: docker
  network_name: anvil-challenges
  network_subnet: "172.20.0.0/16"
  default_timeout: 2h
  max_per_user: 2
  cleanup_interval: 5m
  health_check_interval: 30s
  labels:
    managed-by: anvil

vpn:
  enabled: true
  interface: wg0
  listen_port: 51820
  public_endpoint: ""   # set via ANVIL_VPN_PUBLIC_ENDPOINT in .env
  private_key: ""       # set via ANVIL_VPN_PRIVATE_KEY in .env
  public_key: ""        # set via ANVIL_VPN_PUBLIC_KEY in .env
  address_range: "10.10.0.0/16"
  dns: "1.1.1.1"
  mtu: 1420
  keepalive_interval: 8s
  online_window: 35s

platform:
  name: "Anvil"
  registration_mode: open     # open, invite, token, disabled
  require_email_verify: false
  scoring_enabled: true
  scoreboard_enabled: true
  scoreboard_public: true
  scoring_mode: dynamic       # static, dynamic, time_decay
  flag_submission_enabled: true
  hints_enabled: true
  writeup_submission: false
  default_instance_timeout: 2h
  max_instance_extensions: 3
  extension_duration: 30m

rate_limit:
  enabled: true
  requests_per_minute: 300
  burst_size: 50
  login:
    requests: 5
    window: 15m
  flag_submission:
    requests: 10
    window: 1m
  instance_start:
    requests: 3
    window: 10m
  vpn_config_gen:
    requests: 2
    window: 1h
