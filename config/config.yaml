# anvil platform configuration
# env vars override everything here — prefix with ANVIL_
# e.g. ANVIL_SERVER_PORT=9000, ANVIL_JWT_SECRET=...

environment: production

server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: 30m
  write_timeout: 30m
  shutdown_timeout: 25s
  trusted_proxies:
    - "100.64.0.0/14"   # GKE pod range (every node's /24) — Traefik can land on any node; needed so ClientIP resolves the real client behind the LB
    - "172.16.0.0/12"   # docker-compose dev bridge
    - "127.0.0.1"

database:
  host: postgres
  port: 5432
  user: anvil
  password: ""          # set via ANVIL_DATABASE_PASSWORD in .env
  database: anvil
  ssl_mode: disable
  max_open_conns: 50
  max_idle_conns: 25

storage:
  path: "./data/storage"

jwt:
  secret: ""            # set via ANVIL_JWT_SECRET in .env
  access_expiry: 15m
  refresh_expiry: 168h
  issuer: anvil

container:
  orchestrator: standalone
  network_name: anvil-challenges
  network_subnet: "172.20.0.0/16"
  network_internal: false
  default_timeout: 2h
  max_per_user: 2
  cleanup_interval: 5m
  # Optional single-host routing. When enabled, Anvil gives each HTTP challenge
  # a deterministic hostname and emits Traefik Docker labels. A host reverse
  # proxy can terminate TLS and forward the wildcard namespace to Traefik.
  http_routing: false
  http_base_domain: ""
  http_external_port: 443
  http_external_scheme: https
  # Swarm publishes HTTP backends on an internal ingress range and writes one
  # Traefik file-provider route per instance. Leave blank in standalone mode.
  http_routes_path: ""
  swarm_http_port_min: 31000
  swarm_http_port_max: 31999
  swarm_default_arch: amd64
  # Dedicated non-overlapping overlay address space, split per instance.
  swarm_network_pool: "10.231.0.0/16"
  swarm_network_prefix: 24
  labels:
    managed-by: anvil

vpn:
  enabled: true
  interface: wg0
  listen_port: 51820
  public_endpoint: ""   # set via ANVIL_VPN_PUBLIC_ENDPOINT in .env
  private_key: ""       # set via ANVIL_VPN_PRIVATE_KEY in .env
  public_key: ""        # set via ANVIL_VPN_PUBLIC_KEY in .env
  address_range: "10.10.0.0/16"
  dns: "1.1.1.1"
  mtu: 1420
  keepalive_interval: 8s
  online_window: 35s

platform:
  name: "Anvil"
  registration_mode: open     # open, invite, token, disabled
  scoring_enabled: true
  scoreboard_enabled: true
  scoreboard_public: true

rate_limit:
  enabled: true
  requests_per_minute: 300
  burst_size: 50
  login:
    requests: 5
    window: 15m
  flag_submission:
    requests: 10
    window: 1m
  instance_start:
    requests: 3
    window: 10m
  vpn_config_gen:
    requests: 2
    window: 1h

# Ledger economy — CTF26-1 final, sim-confirmed (see CTF26/ledger-quals-final.md).
# All other economy params use the code defaults (config.go), which already match
# CTF26-1's block; two overrides:
#  - crowd_floors: easy/medium .15 -> .25 (fixes hoarder>beginner, ~2x beginner pts)
#  - launch_costs: insane 250 -> 400 (curbs fast-agent flood of insanes at the drop:
#    top-10 agent share 23% -> 4% in the pessimistic case; elite margin unchanged)
economy:
  crowd_floors: [0.25, 0.25, 0.15, 0.75]
  launch_costs: [50, 100, 200, 400]
