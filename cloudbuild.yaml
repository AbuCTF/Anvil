# builds the Anvil api + web images (amd64, for GKE) on Cloud Build and pushes
# them to Artifact Registry. atom is arm64, so we can't build these locally for
# the x86 nodes — Cloud Build does it natively.
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_AR=asia-south1-docker.pkg.dev/<project>/anvil .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'deployments/docker/Dockerfile.api', '-t', '${_AR}/anvil-api:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'deployments/docker/Dockerfile.web', '--target', 'production', '-t', '${_AR}/anvil-web:latest', './web']
images:
  - '${_AR}/anvil-api:latest'
  - '${_AR}/anvil-web:latest'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
