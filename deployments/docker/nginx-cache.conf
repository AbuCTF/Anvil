# Add this to nginx config for better caching and compression

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/x-javascript image/svg+xml;
gzip_disable "msie6";

# Browser caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Preload critical resources
location = /index.html {
    add_header Link "</build/client/_app/immutable/entry/start.*.js>; rel=preload; as=script" always;
    add_header Link "</build/client/_app/immutable/entry/app.*.js>; rel=preload; as=script" always;
}
