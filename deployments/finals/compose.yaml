x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: ${ANVIL_DATABASE_PASSWORD:?ANVIL_DATABASE_PASSWORD is required}
      POSTGRES_DB: anvil
    volumes:
      - ${ANVIL_DATABASE_HOST_PATH:?ANVIL_DATABASE_HOST_PATH is required}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvil -d anvil"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - platform
    logging: *default-logging
    restart: unless-stopped

  api:
    image: anvil-finals-api:${ANVIL_IMAGE_REVISION:?ANVIL_IMAGE_REVISION_required}
    pull_policy: never
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    environment:
      ANVIL_ENV: production
      ANVIL_CONFIG_OVERLAY: /etc/anvil/finals/game.yaml
      ANVIL_DATABASE_HOST: postgres
      ANVIL_DATABASE_PORT: 5432
      ANVIL_DATABASE_USER: anvil
      ANVIL_DATABASE_PASSWORD: ${ANVIL_DATABASE_PASSWORD:?ANVIL_DATABASE_PASSWORD is required}
      ANVIL_DATABASE_DATABASE: anvil
      ANVIL_DATABASE_SSL_MODE: disable
      ANVIL_STORAGE_PATH: /var/lib/anvil/storage
      ANVIL_SERVER_HOST: 0.0.0.0
      ANVIL_SERVER_PORT: 8080
      ANVIL_SERVER_SHUTDOWN_TIMEOUT: 25s
      ANVIL_JWT_SECRET: ${ANVIL_JWT_SECRET:?ANVIL_JWT_SECRET is required}
      ANVIL_SECRETS_ENCRYPTION_KEY: ${ANVIL_SECRETS_ENCRYPTION_KEY:?ANVIL_SECRETS_ENCRYPTION_KEY is required}
      ANVIL_GAME_INTERNAL_TOKEN: ${ANVIL_GAME_INTERNAL_TOKEN:?ANVIL_GAME_INTERNAL_TOKEN is required}
      ANVIL_GAME_CONTROLLER_ENABLED: "true"
      ANVIL_GAME_TCP_SUBMIT_ENABLED: "true"
      ANVIL_VPN_ENABLED: "${ANVIL_VPN_ENABLED:-false}"
      ANVIL_VPN_PEER_CONTROL: "${ANVIL_VPN_PEER_CONTROL:-external}"
      ANVIL_VPN_PUBLIC_ENDPOINT: "${ANVIL_VPN_PUBLIC_ENDPOINT:-vpn.h7tex.com:443}"
      ANVIL_VPN_PUBLIC_KEY: "${ANVIL_VPN_PUBLIC_KEY:-}"
      ANVIL_VPN_ALLOWED_IPS: "${ANVIL_VPN_ALLOWED_IPS:-10.60.0.0/15}"
      ANVIL_CONTAINER_HTTP_ROUTING: "false"
      ANVIL_CONTAINER_TCP_ROUTING: "false"
      ANVIL_SSO_ENABLED: "false"
      ANVIL_DISCORD_ENABLED: "false"
      ANVIL_WEBVERSE_ENABLED: "false"
    ports:
      - "${ANVIL_PRIVATE_ADDRESS:?ANVIL_PRIVATE_ADDRESS is required}:4141:4141"
    volumes:
      - ./game.yaml:/etc/anvil/finals/game.yaml:ro
      - ${ANVIL_STORAGE_HOST_PATH:?ANVIL_STORAGE_HOST_PATH is required}:/var/lib/anvil/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform
    logging: *default-logging
    stop_grace_period: 35s
    restart: unless-stopped

  web:
    image: anvil-finals-web:${ANVIL_IMAGE_REVISION:?ANVIL_IMAGE_REVISION_required}
    pull_policy: never
    build:
      context: ../../web
      dockerfile: ../deployments/docker/Dockerfile.web
      target: production
    environment:
      NODE_ENV: production
      SHUTDOWN_TIMEOUT: 25
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - platform
    logging: *default-logging
    stop_grace_period: 35s
    restart: unless-stopped

  ingress:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "${ANVIL_PRIVATE_ADDRESS:?ANVIL_PRIVATE_ADDRESS is required}:443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ANVIL_TLS_CERT_PATH:?ANVIL_TLS_CERT_PATH is required}:/run/anvil/tls/fullchain.pem:ro
      - ${ANVIL_TLS_KEY_PATH:?ANVIL_TLS_KEY_PATH is required}:/run/anvil/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      platform:
        ipv4_address: 172.31.26.10
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging: *default-logging
    restart: unless-stopped

networks:
  platform:
    ipam:
      config:
        - subnet: 172.31.26.0/24
