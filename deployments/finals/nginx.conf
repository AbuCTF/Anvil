user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;

    upstream anvil_api {
        server api:8080;
    }

    upstream anvil_web {
        server web:3000;
    }

    server {
        listen 8081;

        location = /healthz {
            proxy_pass http://anvil_api/health;
        }
    }

    server {
        listen 8443 ssl;
        server_name finals.h7tex.com;

        ssl_certificate /run/anvil/tls/fullchain.pem;
        ssl_certificate_key /run/anvil/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;

        location /api/ {
            proxy_pass http://anvil_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Anvil-Geo-Country "";
            proxy_set_header X-Anvil-Geo-Region "";
            proxy_set_header X-Anvil-Geo-City "";
            proxy_set_header X-Anvil-Geo-Latitude "";
            proxy_set_header X-Anvil-Geo-Longitude "";
        }

        location / {
            proxy_pass http://anvil_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
