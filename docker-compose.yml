services:
  postgres:
    image: postgres:16-alpine
    container_name: anvil-postgres
    environment:
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: ${ANVIL_DATABASE_PASSWORD:-anvil}
      POSTGRES_DB: anvil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvil -d anvil"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anvil-internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: anvil-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anvil-internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    container_name: anvil-api
    user: root
    pid: "host"
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - ANVIL_ENV=${ANVIL_ENV:-production}
      - ANVIL_DATABASE_HOST=postgres
      - ANVIL_DATABASE_PORT=5432
      - ANVIL_DATABASE_USER=anvil
      - ANVIL_DATABASE_PASSWORD=${ANVIL_DATABASE_PASSWORD:-anvil}
      - ANVIL_DATABASE_DATABASE=anvil
      - ANVIL_REDIS_HOST=redis
      - ANVIL_REDIS_PORT=6379
      - ANVIL_SERVER_PORT=8080
      - ANVIL_JWT_SECRET=${ANVIL_JWT_SECRET:-change-me}
      - ANVIL_VPN_ENABLED=${ANVIL_VPN_ENABLED:-true}
      - ANVIL_VPN_INTERFACE=${ANVIL_VPN_INTERFACE:-wg0}
      - ANVIL_VPN_LISTEN_PORT=${ANVIL_VPN_LISTEN_PORT:-51820}
      - ANVIL_VPN_PUBLIC_ENDPOINT=${ANVIL_VPN_PUBLIC_ENDPOINT}
      - ANVIL_VPN_PRIVATE_KEY=${ANVIL_VPN_PRIVATE_KEY}
      - ANVIL_VPN_PUBLIC_KEY=${ANVIL_VPN_PUBLIC_KEY}
      - ANVIL_VPN_ADDRESS_RANGE=${ANVIL_VPN_ADDRESS_RANGE:-10.10.0.0/16}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.ssh:/root/.ssh:ro
      - ./data/storage:/var/lib/anvil/storage
      - /var/lib/anvil:/var/lib/anvil
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anvil-internal
      - anvil-challenges
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../deployments/docker/Dockerfile.web
      target: production
      args:
        PUBLIC_API_URL: https://play.abu.rocks
    container_name: anvil-web
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - anvil-internal
    restart: unless-stopped

networks:
  anvil-internal:
    driver: bridge
  anvil-challenges:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
