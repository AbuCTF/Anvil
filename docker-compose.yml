x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: anvil-postgres
    environment:
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: ${ANVIL_DATABASE_PASSWORD:?ANVIL_DATABASE_PASSWORD is required}
      POSTGRES_DB: anvil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvil -d anvil"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anvil-internal
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    container_name: anvil-api
    privileged: true
    pid: "host"
    environment:
      - ANVIL_ENV=${ANVIL_ENV:-production}
      - ANVIL_DATABASE_HOST=postgres
      - ANVIL_DATABASE_PORT=5432
      - ANVIL_DATABASE_USER=anvil
      - ANVIL_DATABASE_PASSWORD=${ANVIL_DATABASE_PASSWORD:?ANVIL_DATABASE_PASSWORD is required}
      - ANVIL_DATABASE_DATABASE=anvil
      - ANVIL_STORAGE_PATH=${ANVIL_STORAGE_PATH:-/var/lib/anvil/storage}
      - ANVIL_SERVER_PORT=8080
      - ANVIL_SERVER_HOST=${ANVIL_SERVER_HOST:-0.0.0.0}
      - ANVIL_SERVER_SHUTDOWN_TIMEOUT=25s
      - ANVIL_JWT_SECRET=${ANVIL_JWT_SECRET:?ANVIL_JWT_SECRET is required}
      - ANVIL_VPN_ENABLED=${ANVIL_VPN_ENABLED:-false}
      - ANVIL_VPN_INTERFACE=${ANVIL_VPN_INTERFACE:-wg0}
      - ANVIL_VPN_LISTEN_PORT=${ANVIL_VPN_LISTEN_PORT:-51820}
      - ANVIL_VPN_PUBLIC_ENDPOINT=${ANVIL_VPN_PUBLIC_ENDPOINT:-}
      - ANVIL_VPN_PRIVATE_KEY=${ANVIL_VPN_PRIVATE_KEY:-}
      - ANVIL_VPN_PUBLIC_KEY=${ANVIL_VPN_PUBLIC_KEY:-}
      - ANVIL_VPN_ADDRESS_RANGE=${ANVIL_VPN_ADDRESS_RANGE:-10.10.0.0/16}
      - ANVIL_PLATFORM_REGISTER_URL=${ANVIL_PLATFORM_REGISTER_URL:-}
      - ANVIL_SSO_ENABLED=${ANVIL_SSO_ENABLED:-false}
      - ANVIL_SSO_SHARED_SECRET=${ANVIL_SSO_SHARED_SECRET:-}
      - ANVIL_DISCORD_ENABLED=${ANVIL_DISCORD_ENABLED:-false}
      - ANVIL_DISCORD_CLIENT_ID=${ANVIL_DISCORD_CLIENT_ID:-}
      - ANVIL_DISCORD_CLIENT_SECRET=${ANVIL_DISCORD_CLIENT_SECRET:-}
      - ANVIL_DISCORD_REDIRECT_URI=${ANVIL_DISCORD_REDIRECT_URI:-}
      - ANVIL_ZEROPOOL_BASE_URL=${ANVIL_ZEROPOOL_BASE_URL:-}
      - ANVIL_ZEROPOOL_API_KEY=${ANVIL_ZEROPOOL_API_KEY:-}
      - ANVIL_ZEROPOOL_EVENT_SLUG=${ANVIL_ZEROPOOL_EVENT_SLUG:-h7ctf-2026}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.docker/config.json:/root/.docker/config.json:ro
      - ${ANVIL_STORAGE_HOST_PATH:-./data/storage}:${ANVIL_STORAGE_PATH:-/var/lib/anvil/storage}
      - /var/lib/anvil:/var/lib/anvil
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anvil-internal
    logging: *default-logging
    stop_grace_period: 35s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../deployments/docker/Dockerfile.web
      target: production
    container_name: anvil-web
    environment:
      - NODE_ENV=production
      - SHUTDOWN_TIMEOUT=25
      - PUBLIC_API_URL=${PUBLIC_API_URL:?PUBLIC_API_URL is required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - anvil-internal
    logging: *default-logging
    stop_grace_period: 35s
    restart: unless-stopped

networks:
  anvil-internal:
    driver: bridge
volumes:
  postgres_data:
